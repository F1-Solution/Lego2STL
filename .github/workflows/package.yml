# Builds the packages for all three systems, each on its own, and publishes them as a release.
#
# Cross-building the programs themselves works from anywhere, but the packages do not: an
# installer needs the Windows toolset, a .deb needs Debian's, and a disk image needs macOS.
# So each one is built where it belongs and the results are collected together.
#
# Pushing a tag of the form v1.2.0 builds everything and publishes a release. Running it by
# hand builds the same packages and leaves them as artifacts, without publishing anything.

name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the packages
        required: false
        default: 0.0.0-dev

# Read-only by default. Only the job that publishes the release is given more, and only that
# job, so a failure anywhere in the build cannot write to the repository.
permissions:
  contents: read

jobs:

  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pick.outputs.number }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      # Worked out once, here, so that every package in a release carries the same number
      # rather than each job deriving its own.
      - name: Work out the version
        id: pick
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          # A tag is written v1.2.0; a version is not. The leading letter is not part of the
          # number, and dotnet refuses the whole string if it is left on, so the build fails
          # at the point where it is least obvious why.
          number="${RAW#v}"

          if ! printf '%s' "$number" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$RAW' is not a version these packages can carry. Tag it v1.2.0, or v1.2.0-rc1."
            exit 1
          fi

          # A hyphen is what marks a pre-release in semantic versioning, so one is announced
          # as a pre-release rather than as a finished version.
          if printf '%s' "$number" | grep -q -- '-'; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $number (pre-release: $prerelease)"

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The whole suite runs on Windows, because reading a document needs the recogniser that
      # is part of Windows. Everything it covers is the same code the other systems run.
      - run: dotnet test --configuration Release --nologo

  windows:
    name: windows
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the installer toolset
        run: dotnet tool install --global wix --version 6.0.1

      # The version reaches the script through the environment rather than being pasted into
      # the command. A tag name can hold quotes and semicolons, and pasting one straight into
      # a shell line lets whoever pushed the tag run commands on the builder.
      - name: Build the package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: ./packaging/build-windows.ps1 -Version "$env:VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/dist/*
          if-no-files-found: error

  linux:
    name: linux
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the package
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: ./packaging/build-unix.sh linux x64 "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/dist/*
          if-no-files-found: error

  macos:
    name: macos
    needs: [test, version]
    runs-on: macos-latest
    strategy:
      matrix:
        # Both, because a Mac binary is built for one processor family or the other and an
        # Intel machine cannot run an Apple silicon build.
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the package
        env:
          VERSION: ${{ needs.version.outputs.number }}
          ARCH: ${{ matrix.arch }}
        run: ./packaging/build-unix.sh macos "$ARCH" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: artifacts/dist/*
          if-no-files-found: error

  release:
    name: release
    needs: [version, windows, linux, macos]

    # Only a tag publishes. Running the workflow by hand builds the same packages and leaves
    # them as artifacts, so the build can be exercised without announcing anything.
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Gather the packages
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f -exec mv -t dist -- {} +

          # Written outside the folder first, so the list does not try to include itself.
          ( cd dist && sha256sum -- * > ../SHA256SUMS.txt )
          mv SHA256SUMS.txt dist/

          echo "Publishing:"
          ls -lh dist

      # The release is made with the tool GitHub ships rather than a third-party action, so
      # nothing outside this repository gets a token that can write to it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.number }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          flags=(--generate-notes --title "Lego2STL $VERSION")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" "${flags[@]}" dist/*
