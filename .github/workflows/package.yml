# Builds the packages for all three systems, each on its own, and publishes them as a release.
#
# Cross-building the programs themselves works from anywhere, but the installers do not: the
# Windows one needs the WiX toolset, and the macOS one needs lipo, pkgbuild and productbuild,
# which ship only with macOS. So each is built where it belongs and the results are collected
# together. None of the three carries .NET 10; each fetches it when the machine has none.
#
# Pushing a tag of the form v1.2.0 builds everything and publishes a release. A push or merge
# to main, or running it by hand, builds the same packages and leaves them as artifacts,
# without publishing anything.
#
# No version is ever passed in, on any trigger. It comes from one place only: the <Version>
# element on Lego2STL.Core.csproj (see packaging/version.sh and CLAUDE.md). A tag still gates
# whether a run publishes, and the release job checks the tag against that version before it
# publishes anything, so the two cannot quietly drift apart.

name: package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

# Read-only by default. Only the job that publishes the release is given more, and only that
# job, so a failure anywhere in the build cannot write to the repository.
permissions:
  contents: read

jobs:

  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pick.outputs.number }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # Worked out once, here, so that every package in a release carries the same number
      # rather than each job deriving its own. The script is shared with the workflow that
      # runs under act, so exercising it locally says something about this one.
      - name: Work out the version
        id: pick
        run: ./packaging/version.sh

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The whole suite runs on Windows, because reading a document needs the recogniser that
      # is part of Windows. Everything it covers is the same code the other systems run.
      #
      # Only the two real test projects, not the whole solution: Lego2STL.OcrSmokeTest builds
      # only for the mobile targets and has no Windows entry point, so running against the
      # solution and forcing every project onto net10.0-windows breaks it.
      #
      # -p:TargetFrameworks forces each project onto this one framework. Without it, restore
      # evaluates Core's full TargetFrameworks list - including the android, ios and macos
      # targets the mobile job below builds - and fails outright if this runner has not got
      # those workloads installed, which it has no reason to for a job that only runs the
      # Windows-only test suite.
      - run: dotnet test tests/Lego2STL.Tests --configuration Release --nologo -p:TargetFrameworks=net10.0-windows10.0.19041.0
      - run: dotnet test tests/Lego2STL.UiTests --configuration Release --nologo -p:TargetFrameworks=net10.0-windows10.0.19041.0

  mobile:
    name: mobile
    needs: [version]
    # Xcode is what net10.0-ios and net10.0-macos need to build at all, and only a macOS
    # runner carries it. The android workload builds anywhere, but there is nothing to gain
    # from a second job just for it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to what the .NET for iOS workload below actually supports: the runner's default
      # Xcode moves ahead of it on its own schedule, and a build for net10.0-ios26.0 refuses to
      # run under an Xcode newer than the one that SDK pack was built against.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the mobile workloads
        run: dotnet workload install android ios maccatalyst macos

      # Build only, one target at a time, and only Core: this proves the three new
      # recognisers compile against the real bindings, which is everything a headless runner
      # can prove. Nothing here boots an emulator or a simulator, and nothing calls the real
      # recogniser - that is left to a person, with tests/Lego2STL.OcrSmokeTest.
      - name: Build Core for android
        run: dotnet build src/Lego2STL.Core/Lego2STL.Core.csproj -c Release -f net10.0-android36.0

      - name: Build Core for ios
        run: dotnet build src/Lego2STL.Core/Lego2STL.Core.csproj -c Release -f net10.0-ios26.0

      - name: Build Core for macos
        run: dotnet build src/Lego2STL.Core/Lego2STL.Core.csproj -c Release -f net10.0-macos26.0

      # Needs a RuntimeIdentifier, unlike Core just above: this is an app, and Release triggers
      # Android's [Register] attribute stripping, which cannot resolve the runtime assemblies
      # it needs without one. arm64 is enough to prove the window itself compiles for Android.
      #
      # A RuntimeIdentifier turns on ahead-of-time compilation by default in Release, which in
      # turn demands trimming - not set on this project, and not worth setting for a step whose
      # only job is proving the window compiles. Off here and on the APK step below for the
      # same reason.
      - name: Build the window for android
        run: dotnet build src/Lego2STL.Gui/Lego2STL.Gui.csproj -c Release -f net10.0-android36.0 -p:RuntimeIdentifier=android-arm64 -p:RunAOTCompilation=false

      # arm64 only: real phones are what this ships to, and every one of them still being sold
      # is arm64. The RuntimeIdentifier moves the publish output under a folder named for it,
      # which is why the artifact path below carries it too.
      - name: Package the APK
        run: dotnet publish src/Lego2STL.Gui/Lego2STL.Gui.csproj -c Release -f net10.0-android36.0 -p:TargetFrameworks=net10.0-android36.0 -p:RuntimeIdentifier=android-arm64 -p:RunAOTCompilation=false

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src/Lego2STL.Gui/bin/Release/net10.0-android36.0/android-arm64/publish/*.apk
          if-no-files-found: error

      # The simulator needs no certificate. A device build does, and there is no Apple
      # Developer Program membership yet, so the signing step below stays switched off
      # until there are secrets to switch it on with.
      #
      # Unlike Android, iOS refuses a RuntimeIdentifier without PublishTrimmed=true, no way
      # around it - and MtouchLink=None is what then keeps trimming from actually removing
      # anything, since this step exists to prove the window compiles, not to trim it.
      #
      # UseInterpreter=true is not a speed hack here, it is the correct mode: a simulator runs
      # on the host CPU and can interpret IL like any other machine, so it never needed the
      # ahead-of-time compile a real device does. Without it, the first run left this step
      # running for over an hour before it was cancelled by hand - a known hang in the AOT
      # compiler on projects that pull in SkiaSharp, which Avalonia does.
      - name: Build the window for the iOS simulator
        run: dotnet build src/Lego2STL.Gui/Lego2STL.Gui.csproj -c Release -f net10.0-ios26.0 -p:RuntimeIdentifier=iossimulator-arm64 -p:PublishTrimmed=true -p:MtouchLink=None -p:UseInterpreter=true

      - name: Sign for a device
        if: false
        run: dotnet publish src/Lego2STL.Gui/Lego2STL.Gui.csproj -c Release -f net10.0-ios26.0 -p:TargetFrameworks=net10.0-ios26.0 -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="${{ secrets.IOS_SIGNING_IDENTITY }}" -p:CodesignProvision="${{ secrets.IOS_PROVISIONING_PROFILE }}"

      # A compile check, same as the window above: arm64 stands in for whichever ABI a real
      # device or emulator needs, and the android-smoke/ios-smoke jobs below build their own
      # copy for the emulator's/simulator's actual architecture.
      - name: Build the pipeline smoke test
        run: |
          dotnet build tests/Lego2STL.MobileSmokeTest -c Release -f net10.0-android36.0 -p:RuntimeIdentifier=android-arm64 -p:RunAOTCompilation=false
          dotnet build tests/Lego2STL.MobileSmokeTest -c Release -f net10.0-ios26.0 -p:RuntimeIdentifier=iossimulator-arm64 -p:PublishTrimmed=true -p:MtouchLink=None -p:UseInterpreter=true

  android-smoke:
    name: android smoke
    needs: [mobile]
    # Intel, not macos-latest (Apple Silicon): GitHub's arm64 macOS runners don't support
    # nested Hypervisor.framework acceleration, so no Android emulator - x86_64 or
    # arm64-v8a - can boot on them. Intel runners still accelerate x86_64 images fine.
    runs-on: macos-13
    # A genuine hang (stuck build, unresponsive emulator) should fail fast instead of
    # running for hours - GitHub's default job timeout is 360 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the mobile workloads
        run: dotnet workload install android

      # One launch and one log line each. Nothing here taps anything, which is what keeps an
      # emulator job worth having: a mis-timed tap is the usual reason they go flaky.
      - name: Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # Above the action's own 600s default: a known source of flakiness on GitHub's
          # macOS runners even when nothing here is wrong - see ReactiveCircus/android-emulator-runner#160.
          emulator-boot-timeout: 900
          # android-x64, not arm64: it has to match arch: x86_64 above, or Install puts a build
          # on the emulator it cannot run.
          # -p:TargetFrameworks pins the project to just this one: it multi-targets android,
          # ios and macos, and without this override MSBuild still needs a workload installed
          # for every one of them, not just the one -f is building.
          script: |
            dotnet build tests/Lego2STL.MobileSmokeTest -c Release -f net10.0-android36.0 -p:TargetFrameworks=net10.0-android36.0 -p:RuntimeIdentifier=android-x64 -p:RunAOTCompilation=false -t:Install
            adb logcat -c
            adb shell am start -n com.lego2stl.pipelinesmoketest/.MainActivity
            timeout 180 adb logcat -s Lego2STL:I -m 1 | tee smoke-android.txt
            grep -q "SMOKE PASS" smoke-android.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-logs
          path: smoke-android.txt
          if-no-files-found: ignore

  ios-smoke:
    name: ios smoke
    needs: [mobile]
    runs-on: macos-latest
    # A genuine hang (stuck build, unresponsive simulator) should fail fast instead of
    # running for hours - GitHub's default job timeout is 360 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # See the mobile job above: pinned to what the .NET for iOS workload supports.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the mobile workloads
        run: dotnet workload install ios

      - name: iOS
        # -p:TargetFrameworks pins the project to just this one: it multi-targets android,
        # ios and macos, and without this override MSBuild still needs a workload installed
        # for every one of them, not just the one -f is building.
        run: |
          dotnet build tests/Lego2STL.MobileSmokeTest -c Release -f net10.0-ios26.0 -p:TargetFrameworks=net10.0-ios26.0 -p:RuntimeIdentifier=iossimulator-arm64 -p:PublishTrimmed=true -p:MtouchLink=None -p:UseInterpreter=true
          APP=$(find tests/Lego2STL.MobileSmokeTest/bin/Release/net10.0-ios26.0 -name "*.app" -maxdepth 3 | head -1)
          # By UDID, not a hardcoded device name like "iPhone 16": the exact simulator names
          # available shift with the Xcode version, and a stale name fails outright.
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcrun simctl boot "$UDID"
          xcrun simctl install booted "$APP"
          xcrun simctl launch --console-pty booted com.lego2stl.pipelinesmoketest | tee smoke-ios.txt
          grep -q "SMOKE PASS" smoke-ios.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke-logs
          path: smoke-ios.txt
          if-no-files-found: ignore

  windows:
    name: windows
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the installer toolset
        run: |
          dotnet tool install --global wix --version 6.0.1
          wix extension add --global WixToolset.UI.wixext/6.0.1
          wix extension add --global WixToolset.Netfx.wixext/6.0.1
          wix extension add --global WixToolset.BootstrapperApplications.wixext/6.0.1

      # The version reaches the script through the environment rather than being pasted into
      # the command. A tag name can hold quotes and semicolons, and pasting one straight into
      # a shell line lets whoever pushed the tag run commands on the builder.
      - name: Build the package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: ./packaging/build-windows.ps1 -Version "$env:VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/dist/*
          if-no-files-found: error

  linux:
    name: linux
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the package
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: ./packaging/build-unix.sh linux x64 "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/dist/*
          if-no-files-found: error

  macos:
    name: macos
    needs: [test, version]
    # One job, not two. The package is universal: the programs are published for both kinds of
    # Mac and fused, so one file serves every machine and only one runner is billed. macOS
    # minutes cost ten times Linux ones.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the package
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: ./packaging/build-unix.sh macos universal "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/dist/*
          if-no-files-found: error

  release:
    name: release
    needs: [version, windows, linux, macos]

    # Only a tag publishes. Running the workflow by hand builds the same packages and leaves
    # them as artifacts, so the build can be exercised without announcing anything.
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The tag decides *whether* to publish; the csproj decides *what version* to publish.
      # Those two must agree, or the release would carry a number the tag never announced.
      - name: Make sure the tag matches the version Lego2STL.Core carries
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          if [ "$tag_version" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match the version Lego2STL.Core carries ($VERSION). Bump <Version> in src/Lego2STL.Core/Lego2STL.Core.csproj to match, or retag." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Gather the packages
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f -exec mv -t dist -- {} +

          # Written outside the folder first, so the list does not try to include itself.
          ( cd dist && sha256sum -- * > ../SHA256SUMS.txt )
          mv SHA256SUMS.txt dist/

          echo "Publishing:"
          ls -lh dist

      # The release is made with the tool GitHub ships rather than a third-party action, so
      # nothing outside this repository gets a token that can write to it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.number }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          notes=$(mktemp)
          {
            echo "Needs **.NET 10**. Each installer puts it in place when the machine has not"
            echo "got it, and leaves it alone when it has. The zip and tarball expect it to be"
            echo "there already."
            echo
            echo "| System | Install with | Or unpack |"
            echo "|---|---|---|"
            echo "| Windows | \`.exe\` | \`.zip\` |"
            echo "| Linux | \`.run\` | \`.tar.gz\` |"
            echo "| macOS | \`.pkg\` (any Mac) | \`.zip\` |"
          } > "$notes"

          flags=(--generate-notes --notes-file "$notes" --title "Lego2STL $VERSION")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" "${flags[@]}" dist/*
